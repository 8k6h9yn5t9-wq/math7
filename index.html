<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Math 7 Practice</title>
<meta name="description" content="7th grade math practice that follows what's being taught in class.">
<meta name="theme-color" content="#2f6fde">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Math 7">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f3f6fb; --card:#ffffff; --ink:#1b2333; --muted:#5d6b82; --line:#dde3ee;
  --brand:#2f6fde; --brand-ink:#ffffff; --brand-soft:#e6efff;
  --good:#1f9d55; --good-soft:#e3f6ea; --bad:#d64545; --bad-soft:#fde8e8;
  --warn:#c77700; --warn-soft:#fff3dc; --key:#eef2f8; --key-ink:#1b2333;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.06);
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10141c; --card:#1a2030; --ink:#e8edf6; --muted:#9aa7bd; --line:#2c3447;
    --brand:#5b8ff0; --brand-ink:#0d1220; --brand-soft:#1f2c4a;
    --good:#3ccf7d; --good-soft:#163525; --bad:#f07070; --bad-soft:#3a1d1f;
    --warn:#f0b04a; --warn-soft:#3a2d14; --key:#252d40; --key-ink:#e8edf6;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
#app{max-width:1180px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 16px);min-height:100%}
h1{font-size:30px;margin:0;line-height:1.15}
h2{font-size:21px;margin:0 0 10px}
h3{font-size:17px;margin:0 0 6px}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center}
.spread{justify-content:space-between}
.wrap{flex-wrap:wrap}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:14px;font-weight:650;background:var(--key);color:var(--key-ink)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.good{background:var(--good);color:#fff}
.btn.small{min-height:38px;padding:0 14px;font-size:15px;border-radius:11px}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:active{transform:scale(.97)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:650;font-size:15px}
.hero{background:linear-gradient(135deg,var(--brand),#6a5cf0);color:#fff;border-radius:22px;padding:22px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero .label{font-size:14px;text-transform:uppercase;letter-spacing:.06em;opacity:.85;font-weight:700}
.hero h2{font-size:26px;margin:4px 0 4px;color:#fff}
.hero .btn{background:#fff;color:#2f4fc0;min-height:56px;font-size:19px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.unit{display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.unit .ic{flex:none;width:48px;height:48px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:24px;font-weight:800}
.unit.now .ic{background:var(--brand);color:#fff}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--good);border-radius:99px}
.tag{display:inline-block;font-size:12px;font-weight:750;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand);vertical-align:middle}
.tag.done{background:var(--good-soft);color:var(--good)}
.section{margin-top:26px}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring>span{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:13px;font-weight:750}

/* practice */
.practice{display:grid;gap:16px;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}
@media (max-width:820px),(orientation:portrait){.practice{grid-template-columns:1fr}}
.qcard{padding:22px}
.qtext{font-size:26px;line-height:1.45;font-weight:600;-webkit-user-select:text;user-select:text}
.qtext i{font-family:"Times New Roman",Georgia,serif;font-size:1.08em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.82em;line-height:1.1;margin:0 .12em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 .2em .05em}
.fr>span:last-child{padding:.05em .2em 0}
.fig{margin:12px 0 2px;color:var(--ink)}
.tbl{border-collapse:collapse;font-size:22px;min-width:160px}
.tbl th,.tbl td{border:2px solid var(--line);padding:4px 18px;text-align:center}
.tbl th{background:var(--brand-soft)}
.answer{margin-top:16px;min-height:72px;border:3px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;padding:6px 12px;background:var(--bg)}
.answer.focus{border-color:var(--brand)}
.answer.ok{border-color:var(--good);background:var(--good-soft)}
.answer.no{border-color:var(--bad);background:var(--bad-soft)}
.answer .ph{color:var(--muted);font-weight:500;font-size:20px}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.key{min-height:64px;border-radius:14px;background:var(--key);color:var(--key-ink);font-size:28px;font-weight:650}
.key.op{color:var(--brand)}
.key.go{background:var(--brand);color:var(--brand-ink);font-size:21px}
.key:active{filter:brightness(.92);transform:scale(.97)}
.choices{display:grid;gap:10px;margin-top:16px}
.choice{min-height:62px;border-radius:14px;background:var(--key);color:var(--key-ink);font-size:23px;font-weight:600;text-align:left;padding:10px 18px;border:3px solid transparent}
.choice i{font-family:"Times New Roman",Georgia,serif;font-size:1.08em}
.choice.ok{border-color:var(--good);background:var(--good-soft)}
.choice.no{border-color:var(--bad);background:var(--bad-soft);opacity:.85}
.choice:disabled{cursor:default}
.feedback{margin-top:14px;border-radius:14px;padding:14px 16px;font-size:18px}
.feedback.ok{background:var(--good-soft);color:var(--good);font-weight:700}
.feedback.no{background:var(--bad-soft);color:var(--bad);font-weight:650}
.feedback.hint{background:var(--warn-soft);color:var(--warn);font-weight:600}
.steps{margin-top:14px;background:var(--brand-soft);border-radius:14px;padding:14px 18px}
.steps ol{margin:6px 0 0;padding-left:22px;font-size:19px}
.steps li{margin:6px 0}
.steps i{font-family:"Times New Roman",Georgia,serif}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--good)} .dot.no{background:var(--bad)} .dot.cur{background:var(--brand)}
.scratch{padding:12px;display:flex;flex-direction:column;position:sticky;top:12px}
.scratch canvas{width:100%;height:min(62vh,560px);border-radius:12px;background:var(--bg);touch-action:none;display:block;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px}
@media (orientation:portrait){.scratch{position:static}.scratch canvas{height:300px}}
.tool{min-height:40px;min-width:44px;padding:0 12px;border-radius:10px;background:var(--key);font-weight:650;font-size:15px}
.tool.on{background:var(--brand);color:var(--brand-ink)}
/* summary */
.big{font-size:64px;font-weight:800;line-height:1}
.center{text-align:center}
/* parent */
table.stats{width:100%;border-collapse:collapse;font-size:15px}
table.stats td,table.stats th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.stats th{color:var(--muted);font-weight:650;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
table.stats .num{text-align:right;font-variant-numeric:tabular-nums}
.chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .b{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--brand);min-height:2px}
.chart .b.zero{background:var(--line)}
.chart small{font-size:11px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi .v{font-size:28px;font-weight:800}
.kpi .l{font-size:13px;color:var(--muted);font-weight:600}
select,input[type=text]{font:inherit;padding:10px 12px;border-radius:11px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-height:46px;max-width:100%}
.mistake{padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.mistake .q{font-weight:600}
.pinbox{max-width:360px;margin:30px auto;text-align:center}
.pindots{display:flex;justify-content:center;gap:14px;margin:18px 0}
.pindots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted)}
.pindots i.f{background:var(--ink);border-color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal .card{max-width:420px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:650;z-index:20}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.install{background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:12px 16px;font-size:15px;margin-bottom:16px}
</style>
</head>
<body>
<div id="app"></div>
<script src="problems.js"></script>
<script src="app.js"></script>
</body>
</html>
